services:

  db:
    image: postgres
    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: securenotes

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data  

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d securenotes"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend

    ports:
      - "5001:5000"

    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: supersecret123
      DB_HOST: db
      DB_USER: admin
      DB_PASSWORD: admin123
      DB_NAME: securenotes

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend
    
volumes:
    postgres_data: