apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: sammanhabib2224/secure-notes-backend:latest

          ports:
            - containerPort: 5000

          env:
            - name: DB_HOST
              value: postgres-service

            - name: DB_USER
              value: admin

            - name: DB_PASSWORD
              value: admin123

            - name: DB_NAME
              value: securenotes

            - name: JWT_SECRET
              value: supersecret123

